<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tvman Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background: linear-gradient(135deg, #080b16, #172d55, #080b16);
    min-height: 100vh;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 70px 20px;
}

h1 {
    font-size: 60px;
    margin-bottom: 10px;
}

p {
    color: #bfc7d9;
    font-size: 18px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 45px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px;
}

.card h2 {
    margin-top: 0;
}

.button {
    display: block;
    padding: 15px;
    margin-top: 20px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    background: #5865F2;
}

.button:hover {
    transform: scale(1.03);
}

.hub {
    background: #2196f3;
}

.bot {
    background: #4752c4;
}

footer {
    margin-top: 60px;
    color: #78849d;
}
</style>
</head>

<body>

<div class="container">

<h1>Tvman Hub</h1>

<p>Welcome to the official Tvman Hub.</p>

<div class="cards">

<div class="card">
<h2>💬 Discord</h2>
<p>Join our Discord community.</p>

<a class="button"
href="https://discord.gg/MGdy8nDGRY"
target="_blank">
Join Discord
</a>
</div>

<div class="card">
<h2>🌐 Tvman Hub</h2>
<p>Open the Tvman Hub website.</p>

<a class="button hub"
href="https://tvman4.github.io/Tvman-Hub/?v=2"
target="_blank">
Open Tvman Hub
</a>
</div>

<div class="card">
<h2>🤖 Add Bot</h2>
<p>Add the Discord bot to your server.</p>

<a class="button bot"
href="https://discord.com/oauth2/authorize?client_id=1548021530552828054&scope=applications.commands%20bot&permissions=8"
target="_blank">
Add Bot
</a>
</div>

</div>

<footer>
Tvman Hub © 2026
</footer>

</div>

</body>
</html>
